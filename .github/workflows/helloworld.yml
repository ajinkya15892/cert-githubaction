name: HelloWorld
on: workflow_dispatch
jobs:    
  Build:
    runs-on: ubuntu-latest
    steps:
    - name: Say hello
      run: |
        echo "Hello World!"

  say-hello-in-python:
    runs-on: ubuntu-latest
    steps:
    - name: Say hello
      run: |
        print("Hello World")
      shell: python

  say-hello-action:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/hello-world-javascript-action@main
      with:
        who-to-greet: 'Mona the Octocat'
