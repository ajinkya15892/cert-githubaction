name: HelloWorld
on: 
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '**.py'
      - '**.yml'
      - "!*.txt"
      - "!README.md"
env:
  WORKFLOW_ENV: Production
jobs:    
  Build:
    env: 
        JOBS_ENV: Staging
    runs-on: ubuntu-latest
    steps:
    - name: Say hello
      env: 
        ENV: Staging1
      run: |
        echo "Hello World! $WORKFLOW_ENV"
        echo "Hello World! $JOBS_ENV"
        echo "Hello World! $ENV"

  say-hello-in-python:
    runs-on: ubuntu-latest
    needs: 
        - Build
    steps:
    - name: Say hello
      run: |
        print("Hello World")
      shell: python

  say-hello-action:
    runs-on: ubuntu-latest
    needs: 
        - say-hello-in-python
    outputs:
        result: ${{ steps.say-hello-action.outputs.result }}
    steps:
    - uses: actions/hello-world-javascript-action@main
      with:
        who-to-greet: 'Mona the Octocat'
